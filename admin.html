<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Mağazam</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">
            <h1><i class="fas fa-store"></i> Mağazam</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Ana</a></li>
            <li><a href="mehsullar.html"><i class="fas fa-box"></i> Məhsullar</a></li>
            <li><a href="haqqimda.html"><i class="fas fa-info-circle"></i> Haqqımızda</a></li>
            <li><a href="elaqe.html"><i class="fas fa-envelope"></i> Əlaqə</a></li>
            <li><a href="admin.html" class="active"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
    </div>
</nav>

<main class="admin-container">
    <!-- Login Section -->
    <div id="loginSection" class="admin-login-card">
        <div class="admin-login-box">
            <i class="fas fa-user-shield admin-icon"></i>
            <h2>Admin Girişi</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="adminUsername" placeholder="İstifadəçi adı">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="adminPassword" placeholder="Şifrə">
            </div>
            <button id="loginBtn" class="btn-login">Daxil ol <i class="fas fa-arrow-right"></i></button>
            <p id="loginError" class="error-message"></p>
        </div>
    </div>

    <!-- Admin Panel Section -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
        <div class="admin-header">
            <h2><i class="fas fa-tachometer-alt"></i> Admin Panel</h2>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Çıxış</button>
        </div>

        <!-- Add Product Section -->
        <div class="admin-card">
            <h3><i class="fas fa-plus-circle"></i> Yeni məhsul əlavə et</h3>
            <div class="form-group">
                <label>Məhsul adı</label>
                <input type="text" id="newName" placeholder="Məs: Qış gödəkçəsi">
            </div>
            <div class="form-group">
                <label>Qiymət (AZN)</label>
                <input type="number" id="newPrice" placeholder="Məs: 89.99">
            </div>
            <div class="form-group">
                <label>Şəkil URL</label>
                <input type="text" id="newImage" placeholder="https://... və ya images/product.jpg">
            </div>
            <button id="addProductBtn" class="btn-add"><i class="fas fa-save"></i> Məhsulu əlavə et</button>
        </div>

        <!-- Products List Section -->
        <div class="admin-card">
            <h3><i class="fas fa-list"></i> Mövcud məhsullar</h3>
            <div id="adminProductList" class="admin-product-list"></div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 Mağazam. Bütün hüquqlar qorunur.</p>
        </div>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
